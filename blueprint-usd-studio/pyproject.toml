[project]
name = "blueprint-usd-studio"
version = "0.1.0"
description = "Blueprint and supporting-source reconstruction into editable OpenUSD scenes"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
    "Pillow>=10,<13",
    "PyMuPDF>=1.24,<2",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.10,<5",
    # Supplies compatible pxr bindings; do not install usd-core alongside it.
    "usd-exchange==3.0.0",
    "shapely>=2.1,<3",
]

[project.optional-dependencies]
runtime = [
    "ovrtx==0.5.0.377615",
    "ovstream==0.4.5",
    # Pulls the matching ovstage version.
    "ovphysx==0.6.3",
    "warp-lang==1.17.0",
]

[dependency-groups]
test = ["pytest>=8,<10", "httpx2==2.13.1"]
browser = ["playwright>=1.63,<2"]

[tool.uv]
package = false
