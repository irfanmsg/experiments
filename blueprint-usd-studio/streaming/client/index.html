<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Blueprint USD Studio — Live View</title>
        <style>
            * { box-sizing: border-box; }
            body { margin:0; background:#101817; color:#eaf0eb; font:14px system-ui,sans-serif; }
            .container { height:100dvh; display:flex; flex-direction:column; }
            header { display:flex; align-items:center; gap:16px; padding:14px 22px; border-bottom:1px solid #30403a; }
            h1 { font-size:17px; margin:0; font-weight:600; }
            .subtitle { color:#9aaca3; font-size:12px; margin-top:4px; }
            .status { margin-left:auto; padding:5px 10px; border-radius:20px; background:#35453e; font-size:12px; }
            .status.ready { background:#274e38; color:#bbefcf; }
            .status.error { background:#642f2f; }
            .status.connecting { background:#685026; }
            .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 22px; }
            button, select, input { font:inherit; }
            .control { border:1px solid #496052; background:#20372b; color:#ecf4ee; padding:8px 12px; border-radius:6px; }
            button { cursor:pointer; }
            button:hover { background:#35523f; }
            button:disabled { opacity:.45; cursor:default; }
            button[aria-pressed="true"] { background:#d6e8b0; color:#172419; border-color:#d6e8b0; }
            :focus-visible { outline:2px solid #e4f5b4; outline-offset:3px; }
            .toolbar .spacer { flex:1; }
            .workspace { flex:1; min-height:0; display:grid; grid-template-columns:260px minmax(0,1fr); gap:1px; background:#30403a; }
            aside { background:#16201c; overflow:auto; padding:16px; }
            aside h2 { font-size:13px; font-weight:600; margin:0 0 8px; }
            #plan-map { width:100%; height:300px; background:#edf0e8; border-radius:6px; }
            #plan-map polygon { fill:#d4dcc8; stroke:#809177; stroke-width:.055; cursor:pointer; }
            #plan-map polygon:hover, #plan-map polygon.selected { fill:#a1be71; }
            #plan-map text { fill:#253223; font-size:.34px; pointer-events:none; text-anchor:middle; dominant-baseline:middle; }
            #room-name { margin:16px 0 5px; font-weight:600; }
            #room-dimensions, .note { color:#aebbb2; font-size:12px; line-height:1.55; }
            #room-select { width:100%; margin:12px 0 8px; }
            .room-actions { display:flex; flex-wrap:wrap; gap:6px; }
            .stream-content { position:relative; min-width:0; min-height:0; display:flex; justify-content:center; align-items:center; overflow:hidden; background:#d2d1cb; }
            #remote-video { display:block; outline:none; cursor:grab; flex:none; }
            #remote-video:active { cursor:grabbing; }
            #source-compare { position:absolute; inset:0; width:100%; height:100%; background:#eee; z-index:2; }
            #source-compare[hidden] { display:none; }
            #loading-info { position:absolute; max-width:400px; text-align:center; padding:20px; background:#17241fe8; color:#eaf0eb; border-radius:8px; pointer-events:none; }
            footer { padding:10px 22px; color:#aebbb2; display:flex; flex-wrap:wrap; align-items:center; gap:12px; font-size:12px; }
            details { margin-left:auto; }
            .control-panel { position:absolute; bottom:48px; right:18px; padding:16px; background:#17241f; border:1px solid #496052; border-radius:8px; display:flex; flex-wrap:wrap; gap:8px; z-index:5; }
            input.control { width:150px; } input.port { width:90px; }
            .workspace.hide-plan { grid-template-columns:minmax(0,1fr); }
            .workspace.hide-plan aside { display:none; }
            @media(max-width:850px) { .workspace { grid-template-columns:190px minmax(0,1fr); } aside {padding:10px;} #plan-map{height:230px;} }
            @media(max-width:600px) { header{padding:10px;} .toolbar{padding:8px;} .workspace{grid-template-columns:minmax(0,1fr);} aside{display:none;} .toolbar .spacer{display:none;} footer{padding:8px;} .control{padding:7px 9px;} #plan-toggle{display:none;} }
        </style>
    </head>
    <body>
        <div class="container">
            <header><div><h1 id="scene-name">Blueprint Studio · Explore</h1><div class="subtitle" id="scene-summary">Live 3D view from your laptop</div></div><span id="status" class="status connecting">Opening view</span></header>
            <div class="toolbar">
                <button class="control" id="overview-button" aria-pressed="true">3D overview</button>
                <button class="control" id="plan-button" aria-pressed="false">Top view</button>
                <button class="control" id="source-button" aria-pressed="false" disabled>Drawing + walls</button>
                <button class="control" id="reset-button">Reset view</button>
                <button class="control" id="zoom-in" aria-label="Zoom in">+</button>
                <button class="control" id="zoom-out" aria-label="Zoom out">−</button>
                <span class="spacer"></span>
                <button class="control" id="plan-toggle" aria-pressed="true">Room plan</button>
                <button class="control" id="size-button">Original size</button>
                <button class="control" id="fullscreen-button">Full screen</button>
            </div>
            <div class="workspace">
                <aside aria-label="Room navigator">
                    <h2>Find your room</h2>
                    <svg id="plan-map" role="img" aria-label="Room layout aligned to the source drawing"></svg>
                    <label for="room-select" class="note">Choose a room to explore</label>
                    <select id="room-select" class="control"><option value="">Whole home</option></select>
                    <div class="room-actions"><button class="control" id="room-button" disabled>View room</button><button class="control" id="interior-button" disabled>Eye level</button></div>
                    <div id="room-name">Whole home</div><div id="room-dimensions"></div>
                    <p class="note" id="geometry-note"></p>
                    <p class="note">Furniture is an illustrative layout, not part of the approved drawing.</p>
                </aside>
                <div class="stream-content">
                    <video id="remote-video" autoplay muted playsinline tabindex="0" aria-label="Interactive 3D view"></video>
                    <audio id="remote-audio" autoplay muted></audio>
                    <svg id="source-compare" hidden aria-label="Source blueprint with reconstructed walls highlighted"></svg>
                    <div id="loading-info">Opening your 3D view…</div>
                </div>
            </div>
            <footer><span id="view-help">Drag to rotate · Scroll to zoom · Choose a room for a closer look</span><details><summary>Connection</summary><div class="control-panel"><label for="server-ip">Server</label><input type="text" id="server-ip" class="control" placeholder="Rendering host"><label for="signal-port">Port</label><input type="number" id="signal-port" class="control port" value="49100" min="1" max="65535"><button id="connect-button" class="control">Connect</button><button id="disconnect-button" class="control" disabled>Disconnect</button></div></details></footer>
        </div>

        <!--
            Classic (non-module) script so file:// opens work. The bundle's
            final line was patched at vendor time from
              export{Na as AppStreamer, ...}
            to
              window.OVWebRTC = {AppStreamer: Na, StreamType: bl, ...}
            so the library exposes a global instead of ES exports. Re-apply
            that patch when re-syncing the bundle.
        -->
        <script src="./omniverse-webrtc-streaming-library.js"></script>
        <script>
            const { AppStreamer, StreamType } = window.OVWebRTC;

            const serverIpInput = document.getElementById('server-ip');
            const signalPortInput = document.getElementById('signal-port');
            const connectButton = document.getElementById('connect-button');
            const disconnectButton = document.getElementById('disconnect-button');
            const statusEl = document.getElementById('status');
            const loadingInfo = document.getElementById('loading-info');

            // The page is served from the rendering laptop. A remote browser
            // must signal to that laptop, rather than to its own loopback.
            serverIpInput.value = window.location.hostname;
            const requestedPort = Number(new URLSearchParams(window.location.search).get('signal_port'));
            if (Number.isInteger(requestedPort) && requestedPort > 0 && requestedPort < 65536) {
                signalPortInput.value = String(requestedPort);
            }

            let connected = false;
            let connectionTimer;

            function setStatus(cls, text) {
                statusEl.className = 'status ' + cls;
                statusEl.textContent = text;
            }

            function setLoading(text) {
                if (text) {
                    loadingInfo.style.display = 'block';
                    loadingInfo.textContent = text;
                } else {
                    loadingInfo.style.display = 'none';
                }
            }

            function setControlsConnected(isConnected) {
                connected = isConnected;
                connectButton.disabled = isConnected;
                disconnectButton.disabled = !isConnected;
                serverIpInput.disabled = isConnected;
                signalPortInput.disabled = isConnected;
            }

            async function connect() {
                if (connected) return;

                const server = serverIpInput.value.trim() || window.location.hostname;
                const signalingPort = parseInt(signalPortInput.value, 10) || 49100;

                setStatus('connecting', 'Connecting');
                setLoading('Connecting to ' + server + ':' + signalingPort + ' ...');
                setControlsConnected(true);
                clearTimeout(connectionTimer);
                connectionTimer = setTimeout(async () => {
                    const video = document.getElementById('remote-video');
                    if (video.readyState >= 2 && !video.paused) return;
                    await disconnect();
                    setStatus('error', 'No video');
                    setLoading('No video arrived. Check that the scene is running and click Connect to retry.');
                }, 30000);

                try {
                    // Note: the server dictates the stream resolution
                    // (whatever was passed to ovstream_start); the client
                    // deliberately does not send width/height here.
                    // Client-driven resize is not currently supported.
                    const result = await AppStreamer.connect({
                        streamSource: StreamType.DIRECT,
                        logLevel: 2,
                        streamConfig: {
                            videoElementId: 'remote-video',
                            audioElementId: 'remote-audio',
                            server,
                            signalingPort,
                            fps: 60,
                            maxReconnects: 3,
                            onStart: (msg) => {
                                if (msg.action !== 'start') return;
                                if (msg.status === 'success') {
                                    setStatus('connecting', 'Loading view');
                                    setLoading('Connected. Waiting for the first picture…');
                                    for (const id of ['remote-video', 'remote-audio']) {
                                        const el = document.getElementById(id);
                                        if (!el) continue;
                                        el.muted = true;
                                        el.defaultMuted = true;
                                        el.volume = 0;
                                        if (id === 'remote-video' && el.srcObject) {
                                            el.play().catch(() => {
                                                setStatus('connecting', 'Click to play');
                                                setLoading('Click the model area to start the picture.');
                                            });
                                        }
                                    }

                                    // Input forwarding (mouse / keyboard) is
                                    // gated behind the library's focusin
                                    // listener on the video's parent: a real
                                    // focus event triggers onFocusStream
                                    // which enables input capture; focusout
                                    // disables it. We wire mouseenter to
                                    // focus() the video (with tabindex to
                                    // make it focusable) so input activates
                                    // as soon as the cursor is over the
                                    // stream, and reactivates automatically
                                    // whenever focus returns to it after the
                                    // user clicks a page button.
                                    const video = document.getElementById('remote-video');
                                    if (video) {
                                        video.focus();
                                    }
                                } else if (msg.status === 'error') {
                                    clearTimeout(connectionTimer);
                                    console.error('Stream start error:', msg.info);
                                    setStatus('error', 'Error');
                                    setLoading('Failed to connect: ' + (msg.info || 'unknown error'));
                                    setControlsConnected(false);
                                }
                            },
                            onStop: (msg) => {
                                if (msg.action !== 'terminate') return;
                                clearTimeout(connectionTimer);
                                if (msg.status === 'error') {
                                    console.error('Stream stopped with error:', msg.info);
                                    setStatus('error', 'Disconnected');
                                    setLoading('Disconnected: ' + (msg.info || 'unknown error'));
                                } else {
                                    setStatus('ready', 'Ready');
                                    setLoading('Disconnected');
                                }
                                setControlsConnected(false);
                            },
                            onUpdate: (msg) => console.log('update', msg),
                        },
                    });
                    console.log('connect() returned', result);
                } catch (err) {
                    clearTimeout(connectionTimer);
                    console.error('Connect threw:', err);
                    setStatus('error', 'Error');
                    setLoading('Connect failed: ' + err.message);
                    setControlsConnected(false);
                }
            }

            async function disconnect() {
                clearTimeout(connectionTimer);
                if (!connected) return;
                setLoading('Disconnecting...');
                try {
                    await AppStreamer.terminate();
                } catch (err) {
                    console.error('Disconnect threw:', err);
                }
                setStatus('ready', 'Ready');
                setLoading('Disconnected');
                setControlsConnected(false);
            }

            connectButton.addEventListener('click', connect);
            disconnectButton.addEventListener('click', disconnect);

            // Refocus the video whenever the cursor re-enters it so
            // input forwarding reactivates after the user clicks a
            // page button (which would otherwise blur the video and
            // trigger the library's onBlurStream -> captureUserInput(false)
            // path, stopping the mouse-cursor indicator on the server).
            const remoteVideo = document.getElementById('remote-video');
            if (remoteVideo) {
                remoteVideo.addEventListener('playing', () => {
                    clearTimeout(connectionTimer);
                    setStatus('ready', 'Live');
                    setLoading('');
                });
                remoteVideo.parentElement.addEventListener('click', () => {
                    if (!connected) return;
                    remoteVideo.muted = true;
                    remoteVideo.focus();
                    remoteVideo.play().catch(() => setLoading('Playback could not start. Disconnect and try again.'));
                });
                remoteVideo.addEventListener('mouseenter', () => {
                    if (connected) remoteVideo.focus();
                });
            }

            let selectedRoom = null;
            let currentView = 'overview';
            let originalSize = false;
            const roomSelect = document.getElementById('room-select');
            const stageArea = document.querySelector('.stream-content');
            function resizeVideo() {
                const aspect = (remoteVideo.videoWidth || 1280) / (remoteVideo.videoHeight || 720);
                let width = Math.min(stageArea.clientWidth, stageArea.clientHeight * aspect);
                if (originalSize) width = Math.min(width, remoteVideo.videoWidth || 1280);
                remoteVideo.style.width = width + 'px';
                remoteVideo.style.height = (width / aspect) + 'px';
            }
            new ResizeObserver(resizeVideo).observe(stageArea);
            remoteVideo.addEventListener('loadedmetadata', resizeVideo);
            async function camera(command) {
                try {
                    document.getElementById('source-compare').setAttribute('hidden','');
                    document.getElementById('source-button').setAttribute('aria-pressed','false');
                    const result = await fetch('/api/camera', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(command)});
                    const data = await result.json();
                    if (!result.ok) throw new Error(data.error || 'Camera unavailable');
                    currentView = data.view;
                    document.getElementById('overview-button').setAttribute('aria-pressed', String(currentView === 'overview'));
                    document.getElementById('plan-button').setAttribute('aria-pressed', String(currentView === 'plan'));
                    document.getElementById('view-help').textContent = currentView === 'interior' ? 'Eye level · Drag to look around · Scroll to move forward/back · Reset view to return' : 'Drag to rotate · Scroll to zoom · Choose a room for a closer look';
                } catch (error) { setLoading(error.message); }
            }
            function chooseRoom(id) {
                selectedRoom = scene.rooms.find(room => room.id === id) || null;
                roomSelect.value = selectedRoom?.id || '';
                document.getElementById('room-button').disabled = !selectedRoom;
                document.getElementById('interior-button').disabled = !selectedRoom;
                document.getElementById('room-name').textContent = selectedRoom?.name || 'Whole home';
                document.getElementById('room-dimensions').textContent = selectedRoom?.dimensions?.length ? selectedRoom.dimensions.map(x => Number(x).toFixed(2)).join(' × ') + ' m · printed dimensions' : '';
                document.querySelectorAll('#plan-map polygon').forEach(p => p.classList.toggle('selected', p.dataset.room === id));
            }
            let scene = {rooms:[]};
            fetch('/api/scene').then(response => {if(!response.ok) throw new Error('Scene controls unavailable'); return response.json();}).then(data => {
                scene = data;
                document.getElementById('scene-name').textContent = data.name || 'Blueprint Studio';
                document.getElementById('scene-summary').textContent = `${data.width} × ${data.height} · ${data.asset_count || 0} furnishings · Live RTX`;
                document.getElementById('geometry-note').textContent = data.geometry_note;
                const svg = document.getElementById('plan-map');
                const points = data.rooms.flatMap(r => r.polygon);
                if (points.length) {
                    const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
                    svg.setAttribute('viewBox', `${Math.min(...xs)-.5} ${-Math.max(...ys)-.5} ${Math.max(...xs)-Math.min(...xs)+1} ${Math.max(...ys)-Math.min(...ys)+1}`);
                }
                data.rooms.forEach((room, index) => {
                    const option = document.createElement('option'); option.value=room.id; option.textContent=room.name; roomSelect.append(option);
                    const poly = document.createElementNS('http://www.w3.org/2000/svg','polygon');
                    poly.setAttribute('points',room.polygon.map(p=>`${p[0]},${-p[1]}`).join(' ')); poly.dataset.room=room.id;
                    const title = document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=room.name;poly.append(title);
                    poly.addEventListener('click',()=>{chooseRoom(room.id);camera({view:'room',room:room.id});});svg.append(poly);
                    const label = document.createElementNS('http://www.w3.org/2000/svg','text');
                    label.setAttribute('x',(room.min[0]+room.max[0])/2);label.setAttribute('y',-(room.min[1]+room.max[1])/2);label.textContent=String(index+1);svg.append(label);
                    option.textContent = `${index+1}. ${room.name}`;
                });
                const cal = data.calibration || {};
                const scale = cal.pixels_per_metre || cal.pixels_per_meter;
                const origin = cal.origin_in_crop_px || cal.pixel_origin;
                if(data.has_source && scale && origin) {
                    const drawing = document.getElementById('source-compare');
                    drawing.setAttribute('viewBox',svg.getAttribute('viewBox'));
                    const picture = document.createElementNS('http://www.w3.org/2000/svg','image');
                    picture.setAttribute('href','/api/source-plan');
                    const size = cal.crop_image_size_px || cal.image_size_px;
                    function placePicture(width,height) {
                        picture.setAttribute('x',-origin[0]/scale);picture.setAttribute('y',-origin[1]/scale);
                        picture.setAttribute('width',width/scale);picture.setAttribute('height',height/scale);
                    }
                    if(size) placePicture(...size);
                    else { const image = new Image();image.onload=()=>placePicture(image.naturalWidth,image.naturalHeight);image.src='/api/source-plan'; }
                    drawing.append(picture);
                    (data.walls || []).forEach(wall=>{
                        const line = document.createElementNS('http://www.w3.org/2000/svg','line');
                        line.setAttribute('x1',wall.start[0]);line.setAttribute('y1',-wall.start[1]);
                        line.setAttribute('x2',wall.end[0]);line.setAttribute('y2',-wall.end[1]);
                        line.setAttribute('stroke','#e27700');line.setAttribute('stroke-width','.065');line.setAttribute('opacity','.85');drawing.append(line);
                    });
                    document.getElementById('source-button').disabled=false;
                }
            }).catch(error => {document.getElementById('geometry-note').textContent=error.message;});
            roomSelect.addEventListener('change',()=>chooseRoom(roomSelect.value));
            document.getElementById('overview-button').onclick = () => camera({view:'overview'});
            document.getElementById('plan-button').onclick = () => camera({view:'plan'});
            document.getElementById('source-button').onclick = (event) => {
                const drawing = document.getElementById('source-compare'); const hidden = drawing.toggleAttribute('hidden');
                event.currentTarget.setAttribute('aria-pressed',String(!hidden));
                document.getElementById('view-help').textContent = hidden ? 'Drag to rotate · Scroll to zoom' : 'Orange lines: reconstructed wall positions over the original drawing · Choose Top view to compare the 3D model';
            };
            document.getElementById('reset-button').onclick = () => {chooseRoom('');camera({view:'overview'});};
            document.getElementById('room-button').onclick = () => camera({view:'room',room:selectedRoom.id});
            document.getElementById('interior-button').onclick = () => camera({view:'interior',room:selectedRoom.id});
            document.getElementById('zoom-in').onclick = () => camera({zoom:1});
            document.getElementById('zoom-out').onclick = () => camera({zoom:-1});
            document.getElementById('plan-toggle').onclick = (event) => {
                const hidden = document.querySelector('.workspace').classList.toggle('hide-plan');
                event.currentTarget.setAttribute('aria-pressed',String(!hidden));
            };
            document.getElementById('size-button').onclick = (event) => {
                originalSize = !originalSize;event.currentTarget.textContent = originalSize ? 'Fit workspace' : 'Original size';resizeVideo();
            };
            document.getElementById('fullscreen-button').onclick = () => {
                if (document.fullscreenElement) document.exitFullscreen();
                else stageArea.requestFullscreen().catch(() => setLoading('Full screen is unavailable in this browser.'));
            };
            connect();

            window.addEventListener('beforeunload', () => {
                if (connected) AppStreamer.terminate();
            });
        </script>
    </body>
</html>
